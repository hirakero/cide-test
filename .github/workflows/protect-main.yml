name: Protect main

on:
  pull_request:
    branches:
      - main

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only staging -> main
        run: |
          if [[ "${GITHUB_HEAD_REF}" != "staging" ]]; then
            echo "Error: Only pull requests from 'staging' are allowed into 'main'."
            echo "Current source branch: ${GITHUB_HEAD_REF}"
            exit 1
          fi
