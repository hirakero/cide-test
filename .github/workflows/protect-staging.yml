name: Protect staging

on:
  pull_request:
    branches:
      - staging

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only develop -> staging
        run: |
          if [[ "${GITHUB_HEAD_REF}" != "develop" ]]; then
            echo "Error: Only pull requests from 'develop' are allowed into 'staging'."
            echo "Current source branch: ${GITHUB_HEAD_REF}"
            exit 1
          fi
